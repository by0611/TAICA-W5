 $('#content').innerHTML=`<div class="results-toolbar"><h2>所有已發布方案的截止日 <span>${entries.length} 項事件</span></h2><button class="btn small" data-action="cal-today">回到本月</button></div><div class="calendar"><div class="calendar-head"><button class="icon-btn" data-action="cal-prev" aria-label="上一個月"><span style="transform:rotate(180deg)">${icon('chevron',18)}</span></button><h2>${year} 年 ${month} 月</h2><button class="icon-btn" data-action="cal-next" aria-label="下一個月">${icon('chevron',18)}</button></div><div class="weekdays">${['日','一','二','三','四','五','六'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar-grid">${Array.from({length:42},(_,i)=>{const day=dayOffset(i,start),es=entries.filter(({e})=>e.end.slice(0,10)===day);return `<div class="cal-day ${day.slice(0,7)!==calMonth?'other':''} ${day===today?'is-today':''}"><span>${Number(day.slice(8))}</span>${es.map(({r,e})=>`<button class="cal-event ${e.type==='報名'?'urgent':''}" data-action="detail" data-id="${esc(r.id)}" title="${esc(r.school+' '+r.program+' '+e.name+' '+deadlineText(e))}">${esc(e.type)} · ${esc(r.school)}${r.isDemo?'［示範］':''}</button>`).join('')}</div>`;}).join('')}</div><div class="calendar-mobile">${entries.map(({r,e})=>`<div class="event-row"><b>${shortDate(e.end)}<br><span style="font-size:9px;color:var(--muted)">${e.precision==='date'?'時間待確認':esc(e.end.slice(11))}</span></b><button style="text-align:left;padding:0" data-action="detail" data-id="${esc(r.id)}"><p>${esc(r.school)} · ${esc(e.name)} ${r.isDemo?'<span class="demo-label">示範</span>':''}</p><small>${esc(r.program)} · ${esc(r.year)} · ${esc(r.channel)}</small></button></div>`).join('')||'<p class="aside-note" style="padding:30px 0">這個月份沒有已知的截止事件。</p>'}</div></div><p class="aside-note" style="margin-top:14px">顯示報名、繳費、上傳、推薦信與其他事件的截止日；點選可查看該方案完整資訊。僅有日期者不推定截止時間。</p>`;
}

iv class="section-inner"><div class="form-grid">${field('報名入口網址','applicationUrl',r.applicationUrl,'url','wide')}${field('報名方式／最終完成條件','applicationNotes',r.applicationNotes,'textarea','wide')}${field('報名步驟（每行一個步驟）','steps',r.steps.join('\n'),'textarea','wide')}</div></div></details><details class="form-section" open><summary>03 重要時程</summary><div class="section-inner"><p class="hint">請分別建立報名、繳費、上傳、推薦信及郵寄等事件。只有日期時不自動推定 23:59；待公告請保持日期留白。首版每方案限一筆「報名」事件，不同輪次請分成獨立方案。</p><div id="eventsEditor">${r.events.map(eventRow).join('')}</div><button type="button" class="btn" data-action="add-event">${icon('plus',14)}新增時程</button></div></details><details class="form-section" open><summary>04 應繳文件</summary><div class="section-inner"><p class="hint">文件可指定個別截止事件；同時上傳與郵寄時可建立兩筆要求，分別指定期限與依據。</p><div id="docsEditor">${r.documents.map(doc=>docRow(doc,r.events)).join('')}</div><button type="button" class="btn" data-action="add-document">${icon('plus',14)}新增文件</button></div></details><details class="form-section" open><summary>05 費用與繳款方式</summary><div class="section-inner"><div class="form-grid">${field('金額（未知留白）','payAmount',r.payment.amount??'','number')}${field('幣別','payCurrency',r.payment.currency,'text','',['TWD','USD','JPY','EUR','其他'])}${field('繳費方式','payMethod',r.payment.method)}<label class="field">帳號類型<select name="payAccountType"><option value="personal" ${r.payment.accountType==='personal'?'selected':''}>個人虛擬帳號（只記取得方式）</option><option value="shared" ${r.payment.accountType==='shared'?'selected':''}>共用繳款帳號</option><option value="none" ${r.payment.accountType==='none'?'selected':''}>不適用／其他支付</option></select></label><label class="field">繳費期限<select name="payDeadline">${eventSelect(r.events,r.payment.deadlineId)}</select></label>${field('繳費／查詢網址','payUrl',r.payment.url,'url')}${field('銀行名稱','payBank',r.payment.bank)}${field('銀行代碼（保留前導零）','payBankCode',r.payment.bankCode)}${field('分行','payBranch',r.payment.branch)}${field('戶名','payHolder',r.payment.holder)}${field('共用帳號（非個人虛擬帳號）','payAccount',r.payment.account)}${field('帳號最後確認日','payConfirmedAt',r.payment.confirmedAt,'date')}${field('取得帳號／繳款操作說明','payInstructions',r.payment.instructions,'textarea','wide')}${field('減免／入帳／查核／退費說明','payNote',r.payment.note,'textarea','wide')}</div><label class="checkbox-field" style="margin-top:15px"><input name="payConfirmed" type="checkbox" ${r.payment.confirmed?'checked':''}>已確認共用帳號適用此方案（虛構示範資料不會公開帳號）</label></div></details><details class="form-section" open><summary>06 聯絡 附件與資料確認</summary><div class="section-inner"><div class="form-grid">${field('承辦單位','contactUnit',r.contact.unit)}${field('電話／分機','contactPhone',r.contact.phone)}${field('Email','contactEmail',r.contact.email,'email')}${field('收件地址','contactAddress',r.contact.address,'text','two')}${field('服務時間','contactHours',r.contact.hours)}${field('公開附件（每行：名稱 | https 網址）','attachments',r.attachments.map(a=>a.name+' | '+a.url).join('\n'),'textarea','wide')}${field('資料提供方式／檔名與頁碼','source',r.source,'text','two',null,true)}${field('最後確認日（尚未確認留白）','verifiedAt',r.verifiedAt,'date')}${field('本次異動原因','changeReason','','text','wide',null,true)}</div></div></details></div><div class="form-footer"><p style="font-size:10px;color:var(--muted)">資料僅供整理，不會送到學校</p><div class="actions"><button type="button" class="btn" data-action="close-editor">取消</button><button class="btn primary" type="submit">${icon('check',15)}儲存方案</button></div></div></form>`;

function collectEditor(){const f=new FormData($('#editorForm')),r=blankRecord(),v=k=>String(f.get(k)||'').trim();r.id=v('id');for(const k of ['school','program','aliases','year','term','degree','channel','group','round','region','field','quota','college','campus','publication','description','eligibility','applicationUrl','applicationNotes','source','verifiedAt'])r[k]=v(k);r.isDemo=f.has('isDemo');r.cancelled=f.has('cancelled');r.steps=v('steps').split('\n').map(s=>s.trim()).filter(Boolean);r.events=readRows('#eventsEditor .event-editor');r.documents=readRows('#docsEditor .doc-editor');r.payment={amount:v('payAmount')===''?null:Number(v('payAmount')),currency:v('payCurrency'),method:v('payMethod'),accountType:v('payAccountType'),bank:v('payBank'),bankCode:v('payBankCode'),branch:v('payBranch'),holder:v('payHolder'),account:v('payAccountType')==='shared'?v('payAccount'):'',confirmed:f.has('payConfirmed'),confirmedAt:v('payConfirmedAt'),url:v('payUrl'),instructions:v('payInstructions'),note:v('payNote'),deadlineId:v('payDeadline')};r.contact={unit:v('contactUnit'),phone:v('contactPhone'),email:v('contactEmail'),address:v('contactAddress'),hours:v('contactHours')};r.attachments=v('attachments').split('\n').filter(s=>s.trim()).map(s=>{const pos=s.indexOf('|');return pos<0?{name:s.trim(),url:''}:{name:s.slice(0,pos).trim(),url:s.slice(pos+1).trim()};});r.updatedAt=nowISO();return {r,reason:v('changeReason')};}
function validateRecords(input){
 const errors=[],records=[];if(!Array.isArray(input)||input.length>MAX_RECORDS)return {errors:['招生資料必須為陣列，最多 '+MAX_RECORDS+' 筆。'],records:[]};const seenId=new Set(),seenKey=new Set();
 input.forEach((raw,index)=>{
  const at='第 '+(index+1)+' 筆：';if(!raw||typeof raw!=='object'||Array.isArray(raw)){errors.push(at+'資料格式不正確');return;}
  const r=blankRecord();for(const key of Object.keys(r)){if(['events','documents','steps','payment','contact','attachments','isDemo','cancelled'].includes(key))continue;if(raw[key]!==undefined)r[key]=String(raw[key]??'').trim();}
  if(!validId(r.id))errors.push(at+'識別碼僅能使用英數字、連字號與底線');if(seenId.has(r.id))errors.push(at+'識別碼重複');seenId.add(r.id);
  for(const k of ['school','program','year','degree','channel','group','round','field','term','region'])if(raw[k]===undefined||!r[k])errors.push(at+k+' 不可留白');
  if(!/^\d{2,3}$/.test(r.year)||Number(r.year)<1)errors.push(at+'入學學年度須為有效民國年');
  if(r.quota!==''&&(!/^\d+$/.test(r.quota)||Number(r.quota)>99999))errors.push(at+'名額須為非負整數，未知請留白');
  if(!['draft','published','archived'].includes(r.publication))errors.push(at+'發布狀態不正確');
  if(r.publication==='published'&&(!r.source||(!r.applicationUrl&&!r.applicationNotes)))errors.push(at+'發布時須填資料提供方式，以及報名網址或待補說明');
  if(r.applicationUrl&&!safeURL(r.applicationUrl))errors.push(at+'報名網址僅接受完整 http 或 https 網址');
  if(!validDate(r.verifiedAt,'date'))errors.push(at+'最後確認日期不正確');if(!Number.isFinite(Date.parse(r.updatedAt)))errors.push(at+'更新時間不正確');
  r.isDemo=raw.isDemo===true;r.cancelled=raw.cancelled===true;
  if(raw.steps!==undefined&&!Array.isArray(raw.steps))errors.push(at+'步驟必須是陣列');r.steps=Array.isArray(raw.steps)?raw.steps.map(String).filter(Boolean):[];
  const events=Array.isArray(raw.events)?raw.events:[];if(raw.events!==undefined&&!Array.isArray(raw.events))errors.push(at+'時程必須是陣列');const eventIds=new Set();
  r.events=events.map((x,i)=>{if(!x||typeof x!=='object'){errors.push(at+'時程 '+(i+1)+' 格式不正確');x={};}const e={};for(const k of ['id','name','type','start','end','precision','rule','notes'])e[k]=String(x[k]??'').trim();if(!validId(e.id)||eventIds.has(e.id))errors.push(at+'時程識別碼空白或重複');eventIds.add(e.id);if(!e.name||!e.type)errors.push(at+'時程名稱及類型不可空白');if(!['date','datetime','pending'].includes(e.precision))errors.push(at+'時程精度不正確');if(e.precision==='pending'&&(e.start||e.end))errors.push(at+'待公告時程不可含日期');if(e.precision!=='pending'&&(!validDate(e.start,e.precision)||!validDate(e.end,e.precision)))errors.push(at+'時程 '+e.name+' 日期或時間格式不正確');if(e.start&&e.end&&e.start>e.end)errors.push(at+'時程 '+e.name+' 開始晚於截止');return e;});
  if(r.events.filter(e=>e.type==='報名').length>1)errors.push(at+'每個方案只接受一筆報名事件；多輪次請另建方案');
  const docs=Array.isArray(raw.documents)?raw.documents:[];if(raw.documents!==undefined&&!Array.isArray(raw.documents))errors.push(at+'文件必須是陣列');const docIds=new Set();
  r.documents=docs.map((x,i)=>{if(!x||typeof x!=='object'){errors.push(at+'文件 '+(i+1)+' 格式不正確');x={};}const doc={};for(const k of ['id','name','required','condition','copies','format','size','pages','delivery','submitter','deadlineId','note','templateUrl'])doc[k]=String(x[k]??'').trim();if(!validId(doc.id)||docIds.has(doc.id))errors.push(at+'文件識別碼空白或重複');docIds.add(doc.id);if(!doc.name)errors.push(at+'文件名稱不可空白');if(!['必繳','選繳','條件必繳'].includes(doc.required))errors.push(at+'文件必要性不正確');if(doc.required==='條件必繳'&&!doc.condition)errors.push(at+'條件必繳須說明條件');if(doc.deadlineId&&!eventIds.has(doc.deadlineId))errors.push(at+'文件 '+doc.name+' 對應的時程不存在');if(doc.templateUrl&&!safeURL(doc.templateUrl))errors.push(at+'文件範本網址不正確');return doc;});
  const pay=raw.payment&&typeof raw.payment==='object'?raw.payment:{};for(const k of Object.keys(r.payment)){if(['amount','confirmed'].includes(k))continue;if(pay[k]!==undefined)r.payment[k]=String(pay[k]??'').trim();}r.payment.amount=pay.amount===null||pay.amount===undefined||pay.amount===''?null:Number(pay.amount);r.payment.confirmed=pay.confirmed===true;
  if(r.payment.amount!==null&&(!Number.isFinite(r.payment.amount)||r.payment.amount<0))errors.push(at+'費用不得為負數或非數值');
  if(!['shared','personal','none'].includes(r.payment.accountType))errors.push(at+'繳款帳號類型不正確');
  if(r.payment.accountType!=='shared')r.payment.account='';
  if(r.payment.account&&(!/^\d{6,30}$/.test(r.payment.account)))errors.push(at+'共用帳號須為 6 至 30 位數字，請勿含空白');
  if(r.payment.bankCode&&!/^\d{3}$/.test(r.payment.bankCode))errors.push(at+'銀行代碼須為 3 位數字');
  if(r.payment.confirmed&&r.payment.accountType==='shared'&&(!r.payment.account||!r.payment.bank||!r.payment.holder||!r.payment.confirmedAt))errors.push(at+'確認共用帳號時須完整填入銀行、戶名、帳號與確認日期');
  if(!validDate(r.payment.confirmedAt,'date'))errors.push(at+'帳號確認日不正確');
  if(r.payment.url&&!safeURL(r.payment.url))errors.push(at+'繳費網址不正確');if(r.payment.deadlineId&&!eventIds.has(r.payment.deadlineId))errors.push(at+'繳費對應的時程不存在');
  const c=raw.contact&&typeof raw.contact==='object'?raw.contact:{};for(const k of Object.keys(r.contact))r.contact[k]=String(c[k]??'').trim();
  const attachments=Array.isArray(raw.attachments)?raw.attachments:[];if(raw.attachments!==undefined&&!Array.isArray(raw.attachments))errors.push(at+'附件必須是陣列');r.attachments=attachments.map(x=>({name:String(x?.name??''),url:String(x?.url??'')}));for(const a of r.attachments)if(!a.name||!safeURL(a.url))errors.push(at+'每筆附件須提供名稱及有效 http／https 網址');
  const key=recordKey(r);if(seenKey.has(key))errors.push(at+'同校同所同年度／學期／班別／管道／組別／梯次的方案重複');seenKey.add(key);records.push(r);
 });return {errors,records};
}
function saveEditor(event){event.preventDefault();const {r,reason}=collectEditor(),old=editingId?getRecord(editingId):null;if(old&&(recordKey(old)!==recordKey(r)||['bank','bankCode','branch','holder','account'].some(k=>old.payment[k]!==r.payment[k]))){const wasConfirmed=r.payment.confirmed;r.payment.confirmed=false;r.payment.confirmedAt='';if(wasConfirmed)toast('帳號或適用方案有變更，已取消原確認。儲存後請重新確認。');}
 const rs=state.records.filter(x=>x.id!==editingId).concat(r),check=validateRecords(rs),errors=check.errors;if(!reason)errors.unshift('請填寫本次異動原因。');if(errors.length){$('#editorErrors').hidden=false;$('#editorErrors').textContent=errors.slice(0,20).join('\n');$('#editorErrors').scrollIntoView({behavior:'smooth',block:'center'});return;}
 const clean=check.records.find(x=>x.id===r.id);historyAdd(old,clean,reason);state.records=check.records;persist();$('#editorDialog').close();render();if(detailId===r.id)renderDetail(r.id,false);toast('已儲存招生方案'+(storageOK?'':'（本次視窗暫存）'));writeRoute();}
function publishToggle(id){const r=getRecord(id);if(!r)return;const next=clone(r);next.publication=r.publication==='published'?'draft':'published';next.updatedAt=nowISO();const check=validateRecords(state.records.map(x=>x.id===id?next:x));if(check.errors.length){showUtility('目前無法發布',`<div class="form-error">${esc(check.errors.join('\n'))}</div><button class="btn primary" data-action="edit" data-id="${esc(id)}">編輯並補齊資料</button>`);return;}historyAdd(r,next,next.publication==='published'?'發布招生方案':'撤回為草稿');state.records=check.records;persist();render();toast(next.publication==='published'?'已發布到研究所清單':'已撤回為草稿');}
function archiveRecord(id){const r=getRecord(id);if(!r)return;const old=clone(r);r.publication=r.publication==='archived'?'draft':'archived';r.updatedAt=nowISO();historyAdd(old,r,r.publication==='archived'?'封存招生方案':'從封存移回草稿');persist();render();toast('已更新發布狀態');}
function deleteRecord(id){const r=getRecord(id);if(!r||!confirm('刪除「'+r.school+' '+r.program+' '+r.year+'」？可由最近 30 筆異動紀錄還原。'))return;historyAdd(r,null,'刪除招生方案');state.records=state.records.filter(x=>x.id!==id);state.favorites=state.favorites.filter(x=>x!==id);persist();if(detailId===id)closeDetail();render();toast('已刪除，可由異動紀錄還原');}
function showUtility(title,body){$('#utilityDialog').innerHTML=`<div class="dialog-head"><h2 id="utilityTitle">${esc(title)}</h2><button class="icon-btn" data-action="close-utility" aria-label="關閉視窗">${icon('close',20)}</button></div><div class="dialog-body">${body}</div>`;if(!$('#utilityDialog').open)$('#utilityDialog').showModal();}
function showHistory(){showUtility('最近 30 筆異動紀錄',state.history.length?state.history.slice().reverse().map(h=>`<div class="history-item"><div><b>${esc(h.reason)}</b><p>${esc((h.after||h.before)?.school||'')} · ${esc((h.after||h.before)?.program||'')}<br>${esc(new Date(h.time).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))}</p></div><button class="btn small" data-action="restore-history" data-id="${esc(h.id)}">還原此項之前</button></div>`).join(''):'<p class="aside-note">尚無異動紀錄。新增、修改、刪除、發布與匯入資料後會記錄在這裡。</p>');}
function restoreHistory(id){const h=state.history.find(x=>x.id===id);if(!h||!confirm('將此方案還原為這次異動前的版本？目前版本仍會記錄在異動紀錄中。'))return;const before=getRecord(h.recordId)||null,target=h.before?clone(h.before):null,rs=state.records.filter(r=>r.id!==h.recordId);if(target){target.updatedAt=nowISO();rs.push(target);}const check=validateRecords(rs);if(check.errors.length){toast('還原失敗：'+check.errors[0]);return;}historyAdd(before,target,'還原歷史版本：'+h.reason);state.records=check.records;state.favorites=state.favorites.filter(x=>getRecord(x));persist();render();if(detailId){if(getRecord(detailId))renderDetail(detailId,false);else closeDetail();}showHistory();toast('已還原，並保留此次操作紀錄');}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
const CSV_HEADERS=['id','school','aliases','program','college','region','campus','field','year','term','degree','channel','group','round','quota','description','eligibility','applicationUrl','applicationNotes','publication','cancelled','isDemo','source','verifiedAt','updatedAt','steps_json','events_json','documents_json','payment_json','contact_json','attachments_json'];
function csvCell(v){const text=String(v??'');return '"'+text.replaceAll('"','""')+'"';}
function csvEncode(records){return '\uFEFF'+[CSV_HEADERS.join(','),...records.map(r=>CSV_HEADERS.map(k=>csvCell(k.endsWith('_json')?JSON.stringify(r[k.slice(0,-5)]):r[k])).join(','))].join('\r\n');}
function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false,afterQuote=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;afterQuote=true;}else cell+=c;continue;}
 if(c==='"'){if(cell||afterQuote)throw Error('CSV 引號位置不正確');quoted=true;}
 else if(c===','){row.push(cell);cell='';afterQuote=false;}
 else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';afterQuote=false;}
 else {if(afterQuote&&c.trim())throw Error('CSV 引號後有非預期字元');if(!afterQuote)cell+=c;}}
 if(quoted)throw Error('CSV 引號沒有結束');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows;
}
function csvToRecords(text){const rows=parseCSV(text);if(!rows.length)throw Error('CSV 是空白檔案');const headers=rows.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('CSV 欄位名稱重複');if(!headers.includes('school')||!headers.includes('program'))throw Error('CSV 至少須包含 school 與 program 欄位');return rows.map((row,i)=>{if(row.length!==headers.length)throw Error('CSV 第 '+(i+2)+' 行欄位數量不符');const raw={};headers.forEach((h,j)=>{if(CSV_HEADERS.includes(h)){if(h.endsWith('_json')){try{raw[h.slice(0,-5)]=row[j]?JSON.parse(row[j]):undefined;}catch{throw Error('CSV 第 '+(i+2)+' 行 '+h+' 的 JSON 不正確');}}else if(['isDemo','cancelled'].includes(h))raw[h]=row[j]==='true';else raw[h]=row[j];}});if(!raw.id)raw.id=uid();if(!raw.updatedAt)raw.updatedAt=nowISO();return raw;});}
function exportJSON(){flushNote();download('研途完整備份_'+todayKey()+'.json',JSON.stringify({...state,exportedAt:nowISO()},null,2),'application/json;charset=utf-8');toast('已匯出 JSON 備份，包含收藏與個人進度');}
function exportCSV(){download('研究所招生資料_'+todayKey()+'.csv',csvEncode(state.records),'text/csv;charset=utf-8');toast('已匯出 CSV；請用文字格式開啟帳號及銀行代碼欄');}
function prepareImport(text,fileName){
 importPending=null;
 let input,mode='merge',backup=null;
 try{if(/\.csv$/i.test(fileName))input=csvToRecords(text);else{const parsed=JSON.parse(text);if(Array.isArray(parsed))input=parsed;else if(parsed&&parsed.version===1&&Array.isArray(parsed.records)){input=parsed.records;mode='replace';backup=parsed;}else throw Error('JSON 須為版本 1 完整備份或招生資料陣列');}}
 catch(e){showUtility('匯入失敗',`<div class="form-error">${esc(e.message)}</div>`);return;}
 const check=validateRecords(input),ids=new Set(check.records.map(r=>r.id)),merged=mode==='replace'?check.records:state.records.filter(r=>!ids.has(r.id)).concat(check.records),full=validateRecords(merged),errors=[...check.errors,...(check.errors.length?[]:full.errors)];
 if(!input.length)errors.push('沒有可匯入的資料。若要清空資料，請透過工作區刪除。');
 const updates=mode==='replace'?0:check.records.filter(r=>getRecord(r.id)).length,adds=mode==='replace'?check.records.length:check.records.length-updates;
 importPending=errors.length?null:{records:full.records,mode,backup,input:check.records};
 showUtility('匯入預覽',`<p class="aside-note">${mode==='replace'?'<b>完整備份還原：</b>確認後將以備份取代目前的招生資料、收藏與個人進度。建議先匯出目前資料。':'<b>合併匯入：</b>相同識別碼會更新，其餘會新增。全部資料驗證通過後才寫入。'}</p><div class="import-summary"><div><b>${adds}</b><small>${mode==='replace'?'備份方案':'新增方案'}</small></div><div><b>${updates}</b><small>更新方案</small></div><div><b>${errors.length}</b><small>錯誤</small></div></div>${errors.length?`<div class="import-errors">${esc(errors.slice(0,50).join('\n'))}${errors.length>50?'\n僅列出前 50 個錯誤。':''}</div>`:`<p class="aside-note">已通過欄位、期限、帳號格式、關聯與方案重複檢查。${mode==='replace'?'還原前資料將自動下載為 JSON 安全備份。':''}</p>`}<div class="actions" style="justify-content:flex-end;margin-top:23px"><button class="btn" data-action="close-utility">取消</button><button class="btn primary" data-action="confirm-import" ${errors.length?'disabled':''}>${mode==='replace'?'還原完整備份':'確認匯入'}</button></div>`);
}
function commitImport(){if(!importPending)return;flushNote();const {records,mode,backup,input}=importPending;if(mode==='replace'){exportJSON();state=cleanEnvelope(backup,records);}else{for(const r of input)historyAdd(getRecord(r.id)||null,r,'匯入招生資料');state.records=records;}importPending=null;persist();$('#utilityDialog').close();if($('#detailDialog').open)closeDetail();view='manage';filters.q='';render();writeRoute();toast('已完成匯入'+(storageOK?'':'；目前只保留於本次視窗，請匯出備份'));}
function showHelp(){showUtility('開始使用研途',`<div class="help-content"><p>這是一個可以直接開啟的單一 HTML 檔案。所有功能在瀏覽器執行，不需要安裝套件或連線。</p><h3>探索與準備</h3><ol><li>搜尋學校、研究所或組別，搭配年度及招生管道篩選。</li><li>點選方案查看時程、報名步驟、文件與繳款資訊。</li><li>點星號收藏；在詳細頁勾選已備妥文件、記錄進度與個人備註。</li><li>開啟行事曆，查看各項截止事件。</li></ol><h3>建立自己的真實資料</h3><p>進入「本機資料工作區」，新增或編輯方案。草稿不顯示在探索清單；資料齊全後將發布狀態設為 published。每次儲存需填異動原因，最近 30 筆變更可還原。</p><p>示範學校、費用及期限均為虛構。真實方案請取消「虛構示範」勾選，再填入自己已確認的資料。個人虛擬帳號僅記錄取得方式，不公開個人帳號。</p><h3>備份與移機</h3><p>完整備份使用 JSON，包含招生資料、收藏、文件勾選、備註與最近異動紀錄。匯入 JSON 完整備份會取代目前資料；匯入 CSV 或 JSON 資料陣列則依識別碼合併。</p><p>CSV 中的 _json 欄位保存重複文件與時程，請保留合法 JSON 格式。一般編輯建議直接用網站表單。銀行代碼與帳號需保留為文字格式，避免前導零消失。</p><h3>本機版本的範圍</h3><p>資料存在目前瀏覽器的本機儲存。搬動 HTML、更換瀏覽器、清除瀏覽資料或使用隱私模式時，資料可能無法保留，請定期備份。不具備管理員認證、雲端同步、通知寄送、實際代報名或付款功能。</p><div class="actions" style="margin-top:20px"><button class="btn primary" data-action="export-json">${icon('download',15)}匯出完整備份</button><button class="btn" data-action="import">${icon('upload',15)}匯入資料</button></div></div>`);}
async function copyAccount(id){const r=getRecord(id);if(!r||r.isDemo||r.payment.accountType!=='shared'||!r.payment.confirmed||!r.payment.account)return;try{await navigator.clipboard.writeText(r.payment.account);toast('已複製共用帳號，請再次核對適用方案');}catch{showUtility('複製繳款帳號',`<p class="aside-note">瀏覽器不允許直接複製，請選取下方文字後複製。</p><label class="field" style="margin-top:15px">${esc(r.school+' '+r.program+' '+r.year+' 學年度')}<input readonly class="mono" value="${esc(r.payment.account)}"></label>`);}}
// 統一使用事件代理，重繪清單後仍可操作；使用者資料一律轉義後再呈現。
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-view]');if(nav){e.preventDefault();setView(nav.dataset.view);return;}
 const scroll=e.target.closest('[data-scroll]');if(scroll){$('#section-'+scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 switch(action){case 'explore':setView('explore');break;case 'manage':setView('manage');break;case 'help':showHelp();break;case 'detail':renderDetail(id);break;case 'open-program':{const r=getRecord(id),rs=matchingRecords().filter(x=>x.school===r.school&&x.program===r.program);if(rs.length<=1)renderDetail(id);else showUtility(r.program+' 的招生方案',`<p class="aside-note">${esc(r.school)} · 請選擇適用的年度與管道</p>${rs.map(x=>`<div class="history-item"><div><b>${esc(x.year)} 學年度 · ${esc(x.channel)} · ${esc(x.degree)}</b><p>${esc(x.group)} · ${esc(x.round)}</p></div><button class="btn small" data-action="choose-offering" data-id="${esc(x.id)}">查看</button></div>`).join('')}`);break;}case 'choose-offering':$('#utilityDialog').close();renderDetail(id);break;
 case 'favorite':flushNote();toggleFavorite(id);break;case 'reset-filters':filters=defaultFilters();render();writeRoute();break;case 'prev-page':filters.page=Math.max(1,filters.page-1);renderResults();writeRoute();$('#resultsArea').scrollIntoView({behavior:'smooth'});break;case 'next-page':filters.page++;renderResults();writeRoute();$('#resultsArea').scrollIntoView({behavior:'smooth'});break;
 case 'close-detail':closeDetail();break;case 'edit':if($('#utilityDialog').open)$('#utilityDialog').close();openEditor(id);break;case 'new':openEditor();break;case 'duplicate':openEditor(id,true);break;case 'close-editor':if(confirm('關閉編輯？尚未儲存的內容會捨棄。'))$('#editorDialog').close();break;case 'print':flushNote();window.print();break;case 'toggle-publish':publishToggle(id);break;case 'archive':archiveRecord(id);break;case 'delete':deleteRecord(id);break;
 case 'add-event':$('#eventsEditor').insertAdjacentHTML('beforeend',eventRow());syncEventSelects();break;case 'add-document':$('#docsEditor').insertAdjacentHTML('beforeend',docRow(undefined,readRows('#eventsEditor .event-editor')));break;case 'remove-row':el.closest('.repeat-row').remove();syncEventSelects();break;
 case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'csv-template':download('研究所招生資料_空白範本.csv','\uFEFF'+CSV_HEADERS.join(',')+'\r\n','text/csv;charset=utf-8');toast('已下載 CSV 欄位範本，新增資料也可直接使用表單');break;case 'import':$('#importFile').value='';$('#importFile').click();break;case 'confirm-import':commitImport();break;case 'close-utility':importPending=null;$('#utilityDialog').close();break;case 'history':showHistory();break;case 'restore-history':restoreHistory(id);break;case 'copy-account':copyAccount(id);break;
 case 'cal-prev':case 'cal-next':{const [y,m]=calMonth.split('-').map(Number),date=new Date(Date.UTC(y,m-1+(action==='cal-next'?1:-1),1));calMonth=date.toISOString().slice(0,7);renderCalendar();break;}case 'cal-today':calMonth=todayKey().slice(0,7);renderCalendar();break;
 }
});
let searchTimer;
document.addEventListener('input',e=>{const el=e.target;if(el.id==='searchInput'){filters.q=el.value;filters.page=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{renderResults();writeRoute();},130);}if(el.id==='manageSearch'){filters.q=el.value;const pos=el.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{renderManage();const input=$('#manageSearch');input.focus();input.setSelectionRange(pos,pos);writeRoute();},180);}if(el.id==='personalNote'){clearTimeout(noteTimer);noteTimer=setTimeout(flushNote,350);}if(el.closest('.event-editor')&&['name','type'].includes(el.dataset.key))syncEventSelects();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){filters[el.dataset.filter]=el.value;filters.page=1;renderResults();writeRoute();}if(el.dataset.doc&&detailId){flushNote();const r=getRecord(detailId);progressFor(r).documents[el.dataset.doc]=el.checked;persist();renderDetail(detailId,false);}if(el.id==='personalStatus'&&detailId){progressFor(getRecord(detailId)).status=el.value;persist();}if(el.id==='personalPaid'&&detailId){progressFor(getRecord(detailId)).paid=el.checked;persist();}if(el.closest('.event-editor')&&el.dataset.key==='precision'){const row=el.closest('.event-editor'),type=el.value==='date'?'date':'datetime-local';row.querySelectorAll('[data-key="start"],[data-key="end"]').forEach(input=>{const old=input.value;input.type=type;input.value=el.value==='date'?old.slice(0,10):'';input.disabled=el.value==='pending';});}if(el.closest('.event-editor'))syncEventSelects();});
document.addEventListener('submit',e=>{if(e.target.id==='editorForm')saveEditor(e);});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>MAX_FILE_BYTES){toast('檔案超過 10 MB，請先縮減資料量');return;}try{prepareImport(await file.text(),file.name);}catch(error){showUtility('無法讀取檔案',`<div class="form-error">${esc(error.message)}</div>`);}});
$('#detailDialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
$('#editorDialog').addEventListener('cancel',e=>{e.preventDefault();if(confirm('關閉編輯？尚未儲存的內容會捨棄。'))$('#editorDialog').close();});
$('#utilityDialog').addEventListener('close',()=>{importPending=null;});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!document.querySelector('dialog[open]')){const input=$('#searchInput')||$('#manageSearch');if(input){e.preventDefault();input.focus();}}});
window.addEventListener('hashchange',()=>{if($('#detailDialog').open){flushNote();$('#detailDialog').close();detailId=null;}const id=readRoute();render();if(id&&getRecord(id))renderDetail(id);});
window.addEventListener('beforeunload',flushNote);
window.addEventListener('pagehide',flushNote);
const routeDetail=readRoute();render();hydrateIcons();if(initialLoadWarning)showStorageWarning(initialLoadWarning);else persist();if(routeDetail&&getRecord(routeDetail))renderDetail(routeDetail);else if(routeDetail)toast('找不到網址指定的方案，可能尚未匯入此筆資料');
setInterval(()=>{if(!document.querySelector('dialog[open]')){renderChrome();if(view==='explore'||view==='favorites')renderResults();}},60000);
</script>
